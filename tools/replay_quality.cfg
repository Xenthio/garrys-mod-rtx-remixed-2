# Starting point for Forward+ image-quality comparisons, not a fast smoke test.
# Add a fixed replay.position / replay.angles and the required asset/mod paths.
# Procedural skies require OPENREMIX_PROXY_BAKE_SKY_REFERENCE (see README).
replay.freezeAnimation=1
replay.styledLights=1
replay.waitForBake=1
replay.requireSky=1
replay.warmupFrames=256
replay.measureFrames=1
rtx.native.forward.samples=4
rtx.native.forward.bakeSamples=256
rtx.native.forward.bakeBounces=3
rtx.native.forward.bakeProbes=32768
rtx.native.forward.lightmapTexels=4194304
rtx.native.forward.reflectionResolution=128
rtx.native.forward.lightmapDenoise=1
rtx.native.forward.lightmapModels=1
rtx.native.forward.bakeCache=1
# Keep the display transform fixed when switching this reference to pathtracing.
# Backend defaults differ in exposure metering and bloom.
rtx.native.forward.autoExposure=0
rtx.native.forward.exposure=1
rtx.native.forward.prism=1
rtx.native.forward.gamma22=1
rtx.native.pathtrace.autoExposure=0
rtx.native.pathtrace.exposure=1
rtx.native.pathtrace.bloom=0
rtx.native.pathtrace.prism=1
rtx.native.pathtrace.gamma22=1
